name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-node20-

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          npm pack --ignore-scripts --json > pack-result.json
          TGZ=$(node -p "require('./pack-result.json')[0].filename")
          test -f "$TGZ"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / {
              if (found) exit
              heading=$2
              gsub(/^\[|\]$/, "", heading)
              if (heading == v) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          {
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "npm i https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.pack.outputs.tgz }}"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.pack.outputs.tgz }}
          fail_on_unmatched_files: true
