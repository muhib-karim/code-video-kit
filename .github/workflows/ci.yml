name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed yet, so cache the npm download cache keyed on package.json.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-node20-

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (tsup, ESM + d.ts)
        run: npm run build

      - name: Pack
        id: pack
        run: |
          npm pack --ignore-scripts
          TGZ=$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-') + '-' + p.version + '.tgz'")
          test -f "$TGZ"
          test -f "$TGZ"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "Packed $TGZ" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "$TGZ" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-video-kit-package
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error
