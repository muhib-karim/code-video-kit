name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (tsup, ESM + d.ts)
        run: npm run build

      # Dev-only tooling is audited separately; this gates what consumers install.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Pack
        id: pack
        run: |
          npm pack --ignore-scripts
          TGZ=$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-') + '-' + p.version + '.tgz'")
          test -f "$TGZ"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "Packed $TGZ" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "$TGZ" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-video-kit-package
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report in the job summary only, so the token can stay read-only.
          GITLEAKS_ENABLE_COMMENTS: false
