name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time on main; a manual run on another branch gets its own group.
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Ensure headless browser for Remotion
        run: npx remotion browser ensure

      - name: Build library
        run: npm run build

      - name: Emit gallery registry
        run: node scripts/emit-registry.mjs

      - name: Render all compositions (timed)
        run: node scripts/render-all.mjs

      - name: Copy measurements into the site
        run: cp results/render-times.json gallery/render-times.json

      - name: Summarize render results
        if: always()
        run: |
          if [ -f results/render-times.md ]; then
            cat results/render-times.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload render times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-times
          path: results/render-times.*
          if-no-files-found: warn

      # Only main publishes. A manual run on any other branch stops here, which
      # makes it a full render check (all compositions) without touching the site.
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: gallery

  deploy:
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
