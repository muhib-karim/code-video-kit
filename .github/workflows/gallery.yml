name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node20-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-node20-

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Ensure headless browser for Remotion
        run: npx remotion browser ensure

      - name: Build library
        run: npm run build

      - name: Emit gallery registry
        run: node scripts/emit-registry.mjs

      - name: Render all compositions (timed)
        run: node scripts/render-all.mjs

      - name: Copy measurements into the site
        run: cp results/render-times.json gallery/render-times.json

      - name: Summarize render results
        if: always()
        run: |
          if [ -f results/render-times.md ]; then
            cat results/render-times.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload render times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-times
          path: results/render-times.*
          if-no-files-found: warn

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
